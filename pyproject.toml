[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyrump"
version = "2.0.0.dev0"
description = "Rutherford backscattering spectrometry (RBS) simulation and analysis, reimplemented from RUMP in Python, with PIXE"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Ilya Kostanovski", email = "ilya.kostanovski@mpi-halle.mpg.de" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "pyreadline3>=3.4; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "pexpect>=4.9",
    "cffi>=1.16",
]
docs = [
    "mkdocs-material>=9.7,<10",
]

[project.urls]
Homepage = "https://github.com/ikost/pyRUMP"
Repository = "https://github.com/ikost/pyRUMP"
Issues = "https://github.com/ikost/pyRUMP/issues"

[project.scripts]
pyrump = "pyrump.cli.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pyrump = ["data/*.dat", "data/*.kal", "data/*.tab", "data/SOURCES.md", "data/pixe/*.csv", "data/pixe/*.csv.gz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "oracle: requires the legacy C reference tree (PYRUMP_C_REFERENCE)",
    "slow: full reference-spectrum matrix",
]

[tool.ruff]
line-length = 100
target-version = "py39"
